<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMint — Websites That Grow Businesses</title>
    <meta name="description" content="WebMint designs and builds premium, high-performing websites and digital experiences that turn visitors into customers." />
    <meta property="og:title" content="WebMint — Websites That Grow Businesses" />
    <meta property="og:description" content="Premium web design, development, and digital marketing for ambitious brands." />
    <meta property="og:type" content="website" />
    <!-- Hero poster is the Largest Contentful Paint element on the home
         page; preloading it lets the browser start fetching it before it
         has even parsed/executed the JS bundle. -->
    <link
      rel="preload"
      as="image"
      href="/hero-poster.jpg"
      imagesrcset="/hero-poster-mobile.jpg 1280w, /hero-poster.jpg 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
